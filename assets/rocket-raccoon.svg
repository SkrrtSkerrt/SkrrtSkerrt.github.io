    <path d="M54 101c14-14 31-22 53-26 25-4 53 0 74 11l31 16c5 3 10 7 15 12-6 5-11 9-17 12l-31 15c-21 10-45 15-68 15-23 0-43-6-59-16-7-5-14-11-20-19 6-8 13-15 22-20z" fill="url(#panel)" opacity=".98"/>
    <path d="M82 117c10-6 23-10 37-11 16-1 32 2 45 8" stroke="#dcd2c7" stroke-width="3" opacity=".42"/>
    <circle cx="91" cy="122" r="6" fill="#d7cabd" stroke="#5c4f46" stroke-width="2"/>
    <circle cx="133" cy="134" r="6" fill="#d7cabd" stroke="#5c4f46" stroke-width="2"/>
    <circle cx="176" cy="123" r="6" fill="#d7cabd" stroke="#5c4f46" stroke-width="2"/>

    <path d="M164 74c14-14 30-22 48-25 13 0 24 4 34 12-2 13-8 24-18 32-13-2-26-1-39 3l-25 9" fill="#816a5d" stroke="#4f423c" stroke-width="3"/>
    <path d="M194 76c11-7 22-10 34-9" stroke="#f5eee7" stroke-width="3" opacity=".45"/>
    <circle cx="214" cy="74" r="5" fill="#efe7dc" opacity=".9"/>

    <path d="M67 121c-14 8-26 17-36 29l16 5c7-7 17-14 31-20" fill="url(#ember)" stroke="#5c1f16" stroke-width="3"/>
    <path d="M40 151l-15 5 10 10 14-7" fill="#685146" stroke="#4f423c" stroke-width="2"/>
    <path d="M48 145c-4 9-7 18-8 27l16-3" stroke="#d9c8b8" stroke-width="2" opacity=".3"/>

