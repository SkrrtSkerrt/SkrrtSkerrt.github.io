      <path d="M62 26c7-3 14-4 21-2-3 7-7 12-13 15" transform="translate(-6 -2)" fill="none" stroke="#7b6b61" stroke-width="2" opacity=".8"/>
    </g>

    <path d="M117 58l12-17 12 17" fill="none" stroke="url(#steel)" stroke-width="4"/>
    <path d="M121 57h20" stroke="#d7cabd" stroke-width="3" opacity=".56"/>

    <g filter="url(#softGlow)">
      <path d="M211 132l10-10" stroke="url(#ember)" stroke-width="4"/>
      <path d="M219 136l14-3" stroke="url(#ember)" stroke-width="3"/>
      <path d="M205 140l12 10" stroke="url(#ember)" stroke-width="3"/>
      <circle cx="219" cy="122" r="3" fill="#ffb45a"/>
      <circle cx="230" cy="126" r="2.5" fill="#ff8a4d"/>
      <circle cx="223" cy="139" r="2.8" fill="#e64d34"/>
