      <path d="M17 24c4-4 9-7 15-8 6-1 12 1 17 4-2 4-4 7-7 10-4 4-8 5-13 5-5 0-9-1-12-4-1-2-1-4 0-7z" fill="url(#glass)" stroke="#d7cabd" stroke-width="1.5"/>
      <circle cx="27" cy="24" r="2.5" fill="#b43a2b"/>
