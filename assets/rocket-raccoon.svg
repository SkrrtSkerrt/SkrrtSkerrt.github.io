<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 180" role="img" aria-labelledby="title desc">
  <title id="title">Rocket raccoon welding motif</title>
  <desc id="desc">A tiny scrap-metal raccoon riding in a welded rocket shell with ember sparks.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e8de"/>
      <stop offset="0.22" stop-color="#a89a8f"/>
      <stop offset="0.5" stop-color="#6f6158"/>
      <stop offset="0.78" stop-color="#efe7dd"/>
      <stop offset="1" stop-color="#8f8177"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f2b"/>
      <stop offset="0.45" stop-color="#1f1a18"/>
      <stop offset="1" stop-color="#4d413b"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb45a"/>
      <stop offset="0.5" stop-color="#e64d34"/>
      <stop offset="1" stop-color="#8c2217"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f5f0" stop-opacity=".92"/>
      <stop offset="1" stop-color="#c2b2a4" stop-opacity=".56"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.35 0 1 0 0 0.16 0 0 1 0 0.08 0 0 0 0.55 0"/>
    </filter>
  </defs>

