      <path d="M0 28c5-10 12-18 21-24 8-6 17-9 26-9 8 0 16 2 22 7 7 5 12 12 15 21-2 11-6 20-13 27-7 7-15 10-24 10-11 0-21-4-30-11C10 42 4 36 0 28z" fill="#e5dbcf" stroke="#4e423c" stroke-width="3"/>
